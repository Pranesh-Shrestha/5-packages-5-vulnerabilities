# One job per language. Each job runs a REAL package-manager install/restore
# so PSE (InvisiRisk) can intercept and attribute the package-registry traffic.
# Each manifest declares 5 target packages (one unique CVE each); real installs
# also resolve transitive dependencies, which is what PSE needs to observe.
# Every job is instrumented with PSE via .baf_setup / .baf_cleanup.

stages:
  - build-1
  - build-2

workflow:
  name: "Combined Multi-Stage Deployment"

variables:
  JAVASCRIPT_PACKAGE_MANAGER:
    value: "npm"
    options: ["npm", "pnpm", "yarn", "bun"]
    description: "JavaScript package manager"
  PYTHON_VERSION:
    value: "3.11"
    options: ["3.9", "3.10", "3.11", "3.12"]
    description: "Python version"
  DOTNET_VERSION:
    value: "8.0"
    options: ["6.0", "7.0", "8.0"]
    description: ".NET version"
  GO_VERSION:
    value: "1.22"
    options: ["1.20", "1.21", "1.22"]
    description: "Go version"
  JAVA_VERSION:
    value: "17"
    options: ["11", "17", "21"]
    description: "Java version"
  PHP_VERSION:
    value: "8.2"
    options: ["8.1", "8.2", "8.3"]
    description: "PHP version"
  RUBY_VERSION:
    value: "3.3"
    options: ["3.0", "3.1", "3.2", "3.3"]
    description: "Ruby version"
  RUST_VERSION:
    value: "1.85"
    options: ["1.79", "1.82", "1.85", "1.90"]
    description: "Rust version (>= 1.85 needed for edition2024 transitive deps)"
  SKIP_JAVASCRIPT:
    value: "false"
    options: ["true", "false"]
    description: "Skip JavaScript"
  SKIP_PYTHON:
    value: "false"
    options: ["true", "false"]
    description: "Skip Python"
  SKIP_DOTNET:
    value: "false"
    options: ["true", "false"]
    description: "Skip .NET"
  SKIP_GO:
    value: "false"
    options: ["true", "false"]
    description: "Skip Go"
  SKIP_JAVA:
    value: "false"
    options: ["true", "false"]
    description: "Skip Java"
  SKIP_PHP:
    value: "false"
    options: ["true", "false"]
    description: "Skip PHP"
  SKIP_RUBY:
    value: "false"
    options: ["true", "false"]
    description: "Skip Ruby"
  SKIP_CARGO:
    value: "false"
    options: ["true", "false"]
    description: "Skip Cargo"

.baf_setup: &baf_setup
  - |
    curl -sSf -H "x-api-key: ${IR_TOKEN}" "https://app.dev.invisirisk.com/ingestionapi/v1/pse/bootstrap" | bash
    . /tmp/ir_envs

.baf_cleanup: &baf_cleanup
  - pse-data-collector cleanup

# ===== Install all technologies (real package managers, PSE intercepts) =====
# Each manifest declares 5 target packages (one CVE each). Real installs also
# pull transitive dependencies, which is what PSE needs to observe/intercept.

# ---------------------------------------------------------------------------
# JavaScript (npm) -- real install so PSE intercepts the registry traffic
# ---------------------------------------------------------------------------
build-javascript:
  stage: build-1
  image: node:20
  rules:
    - if: '$SKIP_JAVASCRIPT != "true"'
  script:
    - apt-get update && apt-get install -y curl
    - *baf_setup
    - cd npm
    - npm install --no-audit --no-fund
    - npm ls --all || true
    - *baf_cleanup

# ---------------------------------------------------------------------------
# Python (PyPI) -- real install so PSE intercepts the PyPI traffic
# ---------------------------------------------------------------------------
build-python:
  stage: build-1
  image: python:${PYTHON_VERSION}
  rules:
    - if: '$SKIP_PYTHON != "true"'
  script:
    - apt-get update && apt-get install -y curl
    - *baf_setup
    - cd pypi
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip list
    - *baf_cleanup

# ---------------------------------------------------------------------------
# .NET (NuGet) -- real restore so PSE intercepts the NuGet traffic
# ---------------------------------------------------------------------------
build-dotnet:
  stage: build-1
  image: mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION}
  rules:
    - if: '$SKIP_DOTNET != "true"'
  script:
    - apt-get update && apt-get install -y curl
    - *baf_setup
    - cd dotnet
    - dotnet restore packages.csproj
    - *baf_cleanup

# ---------------------------------------------------------------------------
# Go -- real module download (declared modules + transitive graph) so PSE
# intercepts the proxy.golang.org traffic
# ---------------------------------------------------------------------------
build-go:
  stage: build-1
  image: golang:${GO_VERSION}
  rules:
    - if: '$SKIP_GO != "true"'
  variables:
    GOFLAGS: "-mod=mod"
  script:
    - apt-get update && apt-get install -y curl
    - *baf_setup
    - cd go
    # Real module resolution so PSE intercepts the proxy.golang.org traffic.
    # No `go mod tidy` (no .go source, so tidy would strip the requires).
    # Download the declared modules plus their transitive graph.
    - go mod download -x
    - go mod graph || true
    - *baf_cleanup

# ---------------------------------------------------------------------------
# Java (Maven) -- real dependency:resolve (transitive deps included) so PSE
# intercepts the Maven Central traffic
# ---------------------------------------------------------------------------
build-java:
  stage: build-2
  image: maven:3.9-eclipse-temurin-${JAVA_VERSION}
  rules:
    - if: '$SKIP_JAVA != "true"'
  script:
    - apt-get update && apt-get install -y curl
    - *baf_setup
    - cd maven
    # Maven's Java HTTP client does NOT read HTTP_PROXY/HTTPS_PROXY env vars, so
    # by default it talks to Central directly (or from ~/.m2 cache) and PSE sees
    # nothing. Feed the PSE proxy to the JVM as system properties, and force a
    # clean re-download so cached artifacts don't short-circuit the network.
    - |
      PROXY_URL="${HTTPS_PROXY:-${https_proxy:-${HTTP_PROXY:-${http_proxy:-}}}}"
      if [ -n "$PROXY_URL" ]; then
        # strip scheme, split host:port
        hostport="${PROXY_URL#*://}"; hostport="${hostport%/}"
        phost="${hostport%%:*}"; pport="${hostport##*:}"
        echo "Routing Maven through PSE proxy $phost:$pport"
        export MAVEN_OPTS="-Dhttp.proxyHost=$phost -Dhttp.proxyPort=$pport -Dhttps.proxyHost=$phost -Dhttps.proxyPort=$pport -Dmaven.wagon.http.ssl.insecure=true -Dmaven.wagon.http.ssl.allowall=true"
      else
        echo "No proxy env found; proceeding without explicit Maven proxy props"
      fi
      # Force fresh resolution through the proxy (-U updates, empty local repo)
      mvn -U -Dmaven.repo.local=./.m2-fresh dependency:resolve
      mvn -Dmaven.repo.local=./.m2-fresh dependency:tree || true
    - *baf_cleanup

# ---------------------------------------------------------------------------
# PHP (Composer) -- real composer install so PSE intercepts the Packagist
# traffic. NOTE: this drives traffic through PSE's Composer handler, which is
# where the `concurrent map writes` crash occurred; if PSE crashes here again
# it is an InvisiRisk product bug, not a manifest/CI issue.
# ---------------------------------------------------------------------------
build-php:
  stage: build-2
  image: php:${PHP_VERSION}-cli
  rules:
    - if: '$SKIP_PHP != "true"'
  script:
    - apt-get update && apt-get install -y curl git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - *baf_setup
    - cd php
    # Plain composer install (works as-is in other CI). One retry to survive a
    # transient PSE-proxy connect blip (curl error 7) seen in GitLab.
    - composer install || { echo "retrying composer install after proxy blip..."; sleep 10; composer install; }
    - composer show || true
    - *baf_cleanup
  artifacts:
    paths:
      - php/composer.json
      - php/composer.lock

# ---------------------------------------------------------------------------
# Ruby (RubyGems) -- real bundle install (deps included) so PSE intercepts
# the rubygems.org traffic
# ---------------------------------------------------------------------------
build-ruby:
  stage: build-2
  image: ruby:${RUBY_VERSION}
  rules:
    - if: '$SKIP_RUBY != "true"'
  script:
    - apt-get update && apt-get install -y curl
    - *baf_setup
    - cd ruby
    # Real bundle install so PSE intercepts the rubygems.org traffic
    - bundle install
    - bundle list || true
    - *baf_cleanup

# ---------------------------------------------------------------------------
# Rust (Cargo) -- real cargo fetch so PSE intercepts the crates.io traffic.
# Uses a newer Rust image so transitive deps needing edition2024 (e.g.
# getrandom) parse correctly.
# ---------------------------------------------------------------------------
build-cargo:
  stage: build-2
  image: rust:${RUST_VERSION}
  rules:
    - if: '$SKIP_CARGO != "true"'
  script:
    - apt-get update && apt-get install -y curl
    - *baf_setup
    - cd cargo
    - cargo generate-lockfile
    - cargo fetch --locked || cargo fetch
    - grep -A1 '^name' Cargo.lock | head -60
    - *baf_cleanup
  artifacts:
    paths:
      - cargo/Cargo.lock
