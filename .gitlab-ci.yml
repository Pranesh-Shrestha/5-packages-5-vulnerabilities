# One job per language. Each job fetches ONLY its 5 listed packages with
# dependency resolution turned OFF, so a scanner reading the manifest sees
# exactly 5 packages and 5 CVEs — no transitive dependencies are pulled.
# Every job is instrumented with PSE (InvisiRisk) via .baf_setup / .baf_cleanup.

stages:
  - build-1
  - build-2

workflow:
  name: "Combined Multi-Stage Deployment"

variables:
  JAVASCRIPT_PACKAGE_MANAGER:
    value: "npm"
    options: ["npm", "pnpm", "yarn", "bun"]
    description: "JavaScript package manager"
  PYTHON_VERSION:
    value: "3.11"
    options: ["3.9", "3.10", "3.11", "3.12"]
    description: "Python version"
  DOTNET_VERSION:
    value: "8.0"
    options: ["6.0", "7.0", "8.0"]
    description: ".NET version"
  GO_VERSION:
    value: "1.22"
    options: ["1.20", "1.21", "1.22"]
    description: "Go version"
  JAVA_VERSION:
    value: "17"
    options: ["11", "17", "21"]
    description: "Java version"
  PHP_VERSION:
    value: "8.2"
    options: ["8.1", "8.2", "8.3"]
    description: "PHP version"
  RUBY_VERSION:
    value: "3.3"
    options: ["3.0", "3.1", "3.2", "3.3"]
    description: "Ruby version"
  RUST_VERSION:
    value: "1.79"
    options: ["1.77", "1.78", "1.79"]
    description: "Rust version"
  SKIP_JAVASCRIPT:
    value: "false"
    options: ["true", "false"]
    description: "Skip JavaScript"
  SKIP_PYTHON:
    value: "false"
    options: ["true", "false"]
    description: "Skip Python"
  SKIP_DOTNET:
    value: "false"
    options: ["true", "false"]
    description: "Skip .NET"
  SKIP_GO:
    value: "false"
    options: ["true", "false"]
    description: "Skip Go"
  SKIP_JAVA:
    value: "false"
    options: ["true", "false"]
    description: "Skip Java"
  SKIP_PHP:
    value: "false"
    options: ["true", "false"]
    description: "Skip PHP"
  SKIP_RUBY:
    value: "false"
    options: ["true", "false"]
    description: "Skip Ruby"
  SKIP_CARGO:
    value: "false"
    options: ["true", "false"]
    description: "Skip Cargo"

.baf_setup: &baf_setup
  - |
    curl -sSf -H "x-api-key: ${IR_TOKEN}" "https://app.dev.invisirisk.com/ingestionapi/v1/pse/bootstrap" | bash
    . /tmp/ir_envs

.baf_cleanup: &baf_cleanup
  - pse-data-collector cleanup

# ============= Fetch all technologies (5 packages / 5 CVEs each) =============

# ---------------------------------------------------------------------------
# JavaScript (npm) -- npm pack downloads only the named tarballs, no deps
# ---------------------------------------------------------------------------
build-javascript:
  stage: build-1
  image: node:20
  rules:
    - if: '$SKIP_JAVASCRIPT != "true"'
  script:
    - apt-get update && apt-get install -y curl
    - *baf_setup
    - cd npm
    - npm pack growl@1.10.1 ini@1.3.5 y18n@5.0.4 hosted-git-info@2.8.8 trim-newlines@3.0.0
    - ls -1 *.tgz
    - *baf_cleanup
  artifacts:
    paths:
      - npm/*.tgz

# ---------------------------------------------------------------------------
# Python (PyPI) -- pip download --no-deps
# ---------------------------------------------------------------------------
build-python:
  stage: build-1
  image: python:${PYTHON_VERSION}
  rules:
    - if: '$SKIP_PYTHON != "true"'
  script:
    - apt-get update && apt-get install -y curl
    - *baf_setup
    - cd pypi
    - python -m pip install --upgrade pip
    - pip download --no-deps -r requirements.txt -d ./wheels
    - ls -1 ./wheels
    - *baf_cleanup
  artifacts:
    paths:
      - pypi/wheels/

# ---------------------------------------------------------------------------
# .NET (NuGet) -- direct .nupkg download from the flat-container API (no deps)
# ---------------------------------------------------------------------------
build-dotnet:
  stage: build-1
  image: mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION}
  rules:
    - if: '$SKIP_DOTNET != "true"'
  script:
    - apt-get update && apt-get install -y curl
    - *baf_setup
    - cd dotnet
    - |
      for pkg in \
        "Steeltoe.Configuration.Encryption:4.1.0" \
        "AngleSharp:1.4.0" \
        "Datadog.Trace:3.42.0" \
        "Steeltoe.Configuration.Abstractions:4.1.0" \
        "Steeltoe.Security.Authentication.CloudFoundryBase:3.3.0"; do
        id="${pkg%%:*}"; ver="${pkg##*:}"
        lid="$(echo "$id" | tr '[:upper:]' '[:lower:]')"
        curl -sSL -o "${id}.${ver}.nupkg" \
          "https://api.nuget.org/v3-flatcontainer/${lid}/${ver}/${lid}.${ver}.nupkg"
      done
    - ls -1 *.nupkg
    - *baf_cleanup
  artifacts:
    paths:
      - dotnet/*.nupkg

# ---------------------------------------------------------------------------
# Go -- go mod download fetches ONLY the named modules, not their deps
# ---------------------------------------------------------------------------
build-go:
  stage: build-1
  image: golang:${GO_VERSION}
  rules:
    - if: '$SKIP_GO != "true"'
  variables:
    GOFLAGS: "-mod=mod"
  script:
    - apt-get update && apt-get install -y curl
    - *baf_setup
    - cd go
    - pwd
    - ls -la
    - |
      go mod download -x \
        github.com/gorilla/schema@v1.4.0 \
        github.com/valyala/fasthttp@v1.33.0 \
        github.com/emicklei/go-restful/v3@v3.7.4 \
        github.com/gin-contrib/cors@v1.5.0 \
        github.com/gorilla/handlers@v1.2.1
    - ls -1 "$(go env GOMODCACHE)/cache/download" || true
    - *baf_cleanup

# ---------------------------------------------------------------------------
# Java (Maven) -- dependency:get with -Dtransitive=false (no transitive deps)
# ---------------------------------------------------------------------------
build-java:
  stage: build-2
  image: maven:3.9-eclipse-temurin-${JAVA_VERSION}
  rules:
    - if: '$SKIP_JAVA != "true"'
  script:
    - apt-get update && apt-get install -y curl
    - *baf_setup
    - cd maven
    - mvn -q dependency:get -Dtransitive=false -Dartifact=org.geysermc.geyser:core:2.9.2 || true
    - mvn -q dependency:get -Dtransitive=false -Dartifact=org.dromara.warm:warm-flow-plugin-modes-sb:1.8.4 || true
    - mvn -q dependency:get -Dtransitive=false -Dartifact=com.vaadin:flow-gradle-plugin:25.1.4 || true
    - mvn -q dependency:get -Dtransitive=false -Dartifact=org.mengyun:tcc-transaction:2.1.0 || true
    - mvn -q dependency:get -Dtransitive=false -Dartifact=com.github.ulisesbocchio:jasypt-spring-boot:4.0.4 || true
    - find ~/.m2/repository -name '*.jar' | sort
    - *baf_cleanup

# ---------------------------------------------------------------------------
# PHP (Composer) -- download each package's dist tarball directly from the
# Packagist API. This pulls ONLY the 5 named packages (no dependency
# resolution) and avoids running `composer install` entirely.
# ---------------------------------------------------------------------------
build-php:
  stage: build-2
  image: php:${PHP_VERSION}-cli
  rules:
    - if: '$SKIP_PHP != "true"'
  script:
    - apt-get update && apt-get install -y curl jq
    - *baf_setup
    - cd php
    - |
      for pkg in \
        "mediawiki/maps:12.1.2" \
        "aimeos/pagible:0.10.3" \
        "php-standard-library/h2:6.1.1" \
        "symfony/ux-icons:2.36.0" \
        "symfony/ux-toolkit:2.36.0"; do
        name="${pkg%:*}"; ver="${pkg##*:}"
        # Resolve the exact version's dist URL from the Packagist metadata (no deps resolved)
        url="$(curl -sSL "https://repo.packagist.org/p2/${name}.json" \
          | jq -r --arg v "$ver" '.packages[][] | select(.version==$v or .version==("v"+$v)) | .dist.url' | head -1)"
        out="$(echo "$name" | tr '/' '-')-${ver}.zip"
        if [ -n "$url" ] && [ "$url" != "null" ]; then
          echo "Downloading $name $ver"
          curl -sSL -o "$out" "$url"
        else
          echo "WARN: could not resolve dist URL for $name $ver"
        fi
      done
    - ls -1 *.zip 2>/dev/null || echo "manifest-only (composer.json pins the 5 packages)"
    - *baf_cleanup
  artifacts:
    paths:
      - php/*.zip
      - php/composer.json

# ---------------------------------------------------------------------------
# Ruby (RubyGems) -- gem install --ignore-dependencies (only the named gem)
# ---------------------------------------------------------------------------
build-ruby:
  stage: build-2
  image: ruby:${RUBY_VERSION}
  rules:
    - if: '$SKIP_RUBY != "true"'
  script:
    - apt-get update && apt-get install -y curl
    - *baf_setup
    - cd ruby
    - gem install fluent-plugin-s3 -v 1.8.4 --ignore-dependencies --no-document
    - gem install fluent-plugin-opentelemetry -v 0.5.2 --ignore-dependencies --no-document
    - gem install sidekiq-cron -v 2.3.1 --ignore-dependencies --no-document
    - gem install katalyst-koi -v 4.19.0 --ignore-dependencies --no-document
    - gem install jwt -v 2.10.2 --ignore-dependencies --no-document
    - gem list --local
    - *baf_cleanup

# ---------------------------------------------------------------------------
# Rust (Cargo) -- download each crate's .crate tarball directly from
# static.crates.io. This fetches ONLY the 5 pinned crates (no transitive
# dependency resolution), so it never trips on a transitive dep that needs a
# newer Cargo edition (e.g. getrandom requiring edition2024).
# ---------------------------------------------------------------------------
build-cargo:
  stage: build-2
  image: rust:${RUST_VERSION}
  rules:
    - if: '$SKIP_CARGO != "true"'
  script:
    - apt-get update && apt-get install -y curl
    - *baf_setup
    - cd cargo
    - |
      for crate in \
        "libsqlite3-sys:0.25.0" \
        "lz4-sys:1.9.3" \
        "ouch:0.3.1" \
        "tonic:0.12.2" \
        "users:0.11.0"; do
        name="${crate%:*}"; ver="${crate##*:}"
        echo "Downloading $name $ver"
        curl -sSL -o "${name}-${ver}.crate" \
          "https://static.crates.io/crates/${name}/${name}-${ver}.crate"
      done
    - ls -1 *.crate
    - *baf_cleanup
  artifacts:
    paths:
      - cargo/*.crate
