[package]
name = "five-vulns-cargo"
version = "1.0.0"
edition = "2021"

# Stub binary target so the manifest is valid (cargo needs a target to lock/fetch).
# Nothing is compiled in CI — jobs only run generate-lockfile + fetch.
[[bin]]
name = "five-vulns-cargo"
path = "src/main.rs"

# 5 crates, each with exactly one CVE
[dependencies]
libsqlite3-sys = "=0.25.0" # CVE-2022-35737
lz4-sys = "=1.9.3"         # CVE-2021-3520
ouch = "=0.3.1"            # CVE-2024-13941
tonic = "=0.12.2"          # CVE-2024-47609
users = "=0.11.0"          # CVE-2025-5791
